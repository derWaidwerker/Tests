---
layout: default
---
{% assign lang = page.lang | default: site.lang %}
{% assign t = site.data.ui.strings[lang] %}
<article>
  <header class="post-header">
    <div class="wrap">
      <div class="post-header__meta">
        <span class="entry__date">{{ page.date | date: t.date_format }}</span>
        {% for tag in page.tags %}<span class="entry__tag">{{ tag }}</span>{% endfor %}
      </div>
      <h1>{{ page.title }}</h1>
    </div>
  </header>
  <div class="post-body wrap">
    {{ content }}
  </div>
</article>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {% if page.rating %}
  "@type": "Review",
  "name": {{ page.title | jsonify }},
  "reviewRating": { "@type": "Rating", "ratingValue": {{ page.rating | jsonify }}, "bestRating": 5 },
  "itemReviewed": {
    "@type": "Product",
    "name": {{ page.product | default: page.title | jsonify }}{% if page.brand %},
    "brand": { "@type": "Brand", "name": {{ page.brand | jsonify }} }{% endif %}{% if page.image %},
    "image": {{ page.image | jsonify }}{% endif %}
  },
  {% else %}
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  {% if page.brand %}"about": { "@type": "Brand", "name": {{ page.brand | jsonify }} },{% endif %}
  {% endif %}
  {% unless page.rating %}{% if page.image %}"image": {{ page.image | jsonify }},{% endif %}{% endunless %}
  "description": {{ page.excerpt | strip_html | strip_newlines | truncate: 200 | jsonify }},
  "inLanguage": {{ lang | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
  "author": { "@type": "Person", "name": {{ site.author.name | jsonify }}, "url": {{ site.url | jsonify }} }
}
</script>
